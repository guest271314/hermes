name: Package Multi-Platform Hermes WASM SDK

on:
  push:
    branches: [ shermes-wasm ]
  pull_request:
    branches: [ shermes-wasm ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build SDK on ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os-name: linux-x86_64
            wasi-asset: x86_64-linux
          - os: macos-14
            os-name: macos-arm64
            wasi-asset: arm64-macos

    env:
      WASI_SDK_TAG: "wasi-sdk-25"
      WASI_SDK_VERSION: "25.0"
      WASI_SDK_PATH: ${{ github.workspace }}/wasi-sdk
      SDK_DIR: hermes-wasm-sdk-${{ matrix.os-name }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: tmikov/hermes
        ref: shermes-wasm
        submodules: recursive

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake git ninja-build python3 tzdata libreadline-dev zip python3-yaml python3-pygments

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja
        pip3 install pyyaml pygments --break-system-packages || pip3 install pyyaml pygments

    - name: Setup WASI SDK
      run: |
        mkdir -p "$WASI_SDK_PATH"
        URL="https://github.com/WebAssembly/wasi-sdk/releases/download/${WASI_SDK_TAG}/wasi-sdk-${WASI_SDK_VERSION}-${{ matrix.wasi-asset }}.tar.gz"
        echo "Downloading $URL"
        curl -fL "$URL" | tar -xzf - --strip-components=1 -C "$WASI_SDK_PATH"
        ls "$WASI_SDK_PATH"
        ls "$WASI_SDK_PATH/share/cmake"

    - name: Configure Host Tools
      run: |
        cmake -G Ninja -S . -B build-host \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DHERMES_ENABLE_INTL=OFF \
          -DHERMES_UNICODE_LITE=ON \
          -DPython3_EXECUTABLE="$(which python3)"

    - name: Compile Host Tools
      run: |
        cmake --build build-host --target hermesc --target hermes --target shermes --target shermes_console_a --target shermes_console --target hermesvmlean_a --parallel 4

    - name: Verify shermes has no ICU dependency
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          LIBS=$(ldd build-host/bin/shermes)
        else
          LIBS=$(otool -L build-host/bin/shermes)
        fi
        echo "$LIBS"
        if echo "$LIBS" | grep -qi icu; then
          echo "ERROR: shermes still links ICU"
          exit 1
        fi

    - name: Configure WebAssembly Libraries
      run: |
        cmake -G Ninja -S . -B build-wasm \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk.cmake" \
          -DWASI_SDK_PREFIX="$WASI_SDK_PATH" \
          -DIMPORT_HOST_COMPILERS=build-host/ImportHostCompilers.cmake \
          -DHERMES_UNICODE_LITE=ON \
          -DLLVM_ENABLE_THREADS=0 \
          -DHERMES_ALLOW_BOOST_CONTEXT=0 \
          -DHERMES_CHECK_NATIVE_STACK=OFF

    - name: Compile WebAssembly Libraries
      run: |
        cmake --build build-wasm --target sh-demo --parallel 4

    - name: Bundle SDK
      run: |
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/lib" "$SDK_DIR/include" "$SDK_DIR/obj"

        # Copy a file found anywhere under a build dir; fail clearly if missing
        grab() {  # grab <build-dir> <filename> <dest-dir>
          f=$(find "$1" -name "$2" -type f | head -n 1)
          if [ -z "$f" ]; then
            echo "ERROR: $2 not found under $1"
            find "$1" -name "*.a" | head -50
            exit 1
          fi
          echo "Found $f"
          cp "$f" "$3/"
        }

        grab build-host shermes "$SDK_DIR/bin"
        grab build-wasm libshermes_console_a.a "$SDK_DIR/lib"
        grab build-wasm libhermesvmlean_a.a "$SDK_DIR/lib"
        grab build-wasm libjsi.a "$SDK_DIR/lib"
        grab build-wasm cxa.cpp.obj "$SDK_DIR/obj"
        grab build-wasm libhermesvm-config.h "$SDK_DIR/include"
        cp -r include/hermes "$SDK_DIR/include/"

        cat > "$SDK_DIR/README.txt" <<'EOF'
        Static Hermes WebAssembly SDK
        =============================

        How to compile your JavaScript/TypeScript files to standalone WASM using this package:

        1. Transpile your input source file into native C:
           ./bin/shermes -v -Os -g -fauto-detect-static-builtins -typed -Xenable-tdz -emit-c nm_shermes.ts -o nm_shermes.c

        2. Compile the C code using your local wasi-clang toolchain (set the WasiSdk environment variable):
           $WasiSdk/bin/clang nm_shermes.c -c -O3 -DNDEBUG -fno-strict-aliasing -fno-strict-overflow -I. -I./include -mllvm -wasm-enable-sjlj -Wno-c23-extensions -o nm_shermes.o

        3. Link the object code into a standalone .wasm executable:
           $WasiSdk/bin/clang++ -O3 nm_shermes.o ./obj/cxa.cpp.obj -o nm_shermes.wasm -L./lib -lshermes_console_a -lhermesvmlean_a -ljsi -lwasi-emulated-mman -lsetjmp
        EOF

        tar -czf "$SDK_DIR.tar.gz" "$SDK_DIR/"

    - name: Upload Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SDK_DIR }}
        path: ${{ env.SDK_DIR }}.tar.gz
        if-no-files-found: error

    - name: Show CMake logs on failure
      if: failure()
      run: |
        for f in build-host/CMakeFiles/CMakeConfigureLog.yaml build-host/CMakeFiles/CMakeError.log; do
          if [ -f "$f" ]; then echo "===== $f ====="; tail -n 80 "$f"; fi
        done
        true
