name: Package Multi-Platform Hermes WASM SDK

on:
  push:
    branches: [ shermes-wasm ]
  pull_request:
    branches: [ shermes-wasm ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build SDK on ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os-name: linux-x86_64
            artifact-ext: zip
          - os: macos-14
            os-name: macos-arm64
            artifact-ext: tar.gz

    env:
      WASI_SDK_VERSION: "25.0"
      WASI_SDK_PATH: ${{ github.workspace }}/wasi-sdk-25

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: tmikov/hermes
        ref: shermes-wasm
        submodules: recursive

    - name: Install System Dependencies (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake git ninja-build libicu-dev python3 tzdata libreadline-dev zip \
                               python3-yaml python3-pygments

    - name: Install System Dependencies (macOS)
      if: matrix.os == 'macos-14'
      run: |
        brew install cmake ninja icu4c
        pip3 install pyyaml pygments --break-system-packages || pip3 install pyyaml pygments
        echo "ICU_ROOT=$(brew --prefix icu4c)" >> $GITHUB_ENV

    - name: Setup WebAssembly Wasi-SDK (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        mkdir -p "${{ env.WASI_SDK_PATH }}"
        curl -L "https://github.com{{ env.WASI_SDK_VERSION }}-x86_64-linux.tar.gz" | tar -xzf - --strip-components=1 -C "${{ env.WASI_SDK_PATH }}"

    - name: Setup WebAssembly Wasi-SDK (macOS)
      if: matrix.os == 'macos-14'
      run: |
        mkdir -p "${{ env.WASI_SDK_PATH }}"
        curl -L "https://github.com{{ env.WASI_SDK_VERSION }}-macos.tar.gz" | tar -xzf - --strip-components=1 -C "${{ env.WASI_SDK_PATH }}"

    - name: Step 1a: Configure and Build Host Tools (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        cmake -G Ninja -S . -B build-host \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++
        
        cmake --build build-host --target hermesc --target hermes --target shermes \
          --target shermes_console_a --target shermes_console --target hermesvmlean_a --parallel 4

    - name: Step 1b: Configure and Build Host Tools (macOS)
      if: matrix.os == 'macos-14'
      run: |
        cmake -G Ninja -S . -B build-host \
          -DCMAKE_BUILD_TYPE=Release \
          -DICU_ROOT=$ICU_ROOT \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++
        
        cmake --build build-host --target hermesc --target hermes --target shermes \
          --target shermes_console_a --target shermes_console --target hermesvmlean_a --parallel 4

    - name: Step 2: Configure and Build WebAssembly Target Libraries
      run: |
        cmake -G Ninja -S . -B build-wasm \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_TOOLCHAIN_FILE="${{ env.WASI_SDK_PATH }}/share/cmake/wasi-sdk.cmake" \
          -DWASI_SDK_PREFIX="${{ env.WASI_SDK_PATH }}" \
          -DIMPORT_HOST_COMPILERS=build-host/ImportHostCompilers.cmake \
          -DHERMES_UNICODE_LITE=ON \
          -DLLVM_ENABLE_THREADS=0 \
          -DHERMES_ALLOW_BOOST_CONTEXT=0 \
          -DHERMES_CHECK_NATIVE_STACK=OFF

        cmake --build build-wasm --target sh-demo --parallel 4

    - name: Step 3a: Bundle and Structure the SDK Workspace (Linux Package)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        SDK_DIR="hermes-wasm-sdk-${{ matrix.os-name }}"
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/lib" "$SDK_DIR/include" "$SDK_DIR/obj"

        cp build-host/bin/shermes "$SDK_DIR/bin/"
        cp build-wasm/lib/libshermes_console_a.a "$SDK_DIR/lib/"
        cp build-wasm/lib/libhermesvmlean_a.a "$SDK_DIR/lib/"
        cp build-wasm/jsi/libjsi.a "$SDK_DIR/lib/"
        cp build-wasm/tools/sh-demo/CMakeFiles/sh-demo.dir/cxa.cpp.obj "$SDK_DIR/obj/"
        cp build-wasm/lib/config/libhermesvm-config.h "$SDK_DIR/include/"
        cp -r include/hermes "$SDK_DIR/include/"

        echo "Static Hermes WebAssembly SDK" >> "$SDK_DIR/README.txt"
        echo "=============================" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "How to compile your JavaScript/TypeScript files to standalone WASM using this package:" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "1. Transpile your input source file into Native C:" >> "$SDK_DIR/README.txt"
        echo "   ./bin/shermes -v -Os -g -fauto-detect-static-builtins -typed -Xenable-tdz -emit-c nm_shermes.ts -o nm_shermes.c" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "2. Compile the C code using your local wasi-clang toolchain (Ensure WasiSdk environment variable is set):" >> "$SDK_DIR/README.txt"
        echo "   \$WasiSdk/bin/clang nm_shermes.c -c -O3 -DNDEBUG -fno-strict-aliasing -fno-strict-overflow -I. -I./include -mllvm -wasm-enable-sjlj -Wno-c23-extensions -o nm_shermes.o" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "3. Link the object code into your final standalone .wasm executable module matching your exact arguments:" >> "$SDK_DIR/README.txt"
        echo "   \$WasiSdk/bin/clang++ -O3 nm_shermes.o ./obj/cxa.cpp.obj -o nm_shermes.wasm -L./lib -lshermes_console_a -lhermesvmlean_a -ljsi -lwasi-emulated-mman -lsetjmp" >> "$SDK_DIR/README.txt"

        zip -r "$SDK_DIR.zip" "$SDK_DIR/"

    - name: Step 3b: Bundle and Structure the SDK Workspace (macOS Package)
      if: matrix.os == 'macos-14'
      run: |
        SDK_DIR="hermes-wasm-sdk-${{ matrix.os-name }}"
        mkdir -p "$SDK_DIR/bin" "$SDK_DIR/lib" "$SDK_DIR/include" "$SDK_DIR/obj"

        cp build-host/bin/shermes "$SDK_DIR/bin/"
        cp build-wasm/lib/libshermes_console_a.a "$SDK_DIR/lib/"
        cp build-wasm/lib/libhermesvmlean_a.a "$SDK_DIR/lib/"
        cp build-wasm/jsi/libjsi.a "$SDK_DIR/lib/"
        cp build-wasm/tools/sh-demo/CMakeFiles/sh-demo.dir/cxa.cpp.obj "$SDK_DIR/obj/"
        cp build-wasm/lib/config/libhermesvm-config.h "$SDK_DIR/include/"
        cp -r include/hermes "$SDK_DIR/include/"

        echo "Static Hermes WebAssembly SDK" >> "$SDK_DIR/README.txt"
        echo "=============================" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "How to compile your JavaScript/TypeScript files to standalone WASM using this package:" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "1. Transpile your input source file into Native C:" >> "$SDK_DIR/README.txt"
        echo "   ./bin/shermes -v -Os -g -fauto-detect-static-builtins -typed -Xenable-tdz -emit-c nm_shermes.ts -o nm_shermes.c" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "2. Compile the C code using your local wasi-clang toolchain (Ensure WasiSdk environment variable is set):" >> "$SDK_DIR/README.txt"
        echo "   \$WasiSdk/bin/clang nm_shermes.c -c -O3 -DNDEBUG -fno-strict-aliasing -fno-strict-overflow -I. -I./include -mllvm -wasm-enable-sjlj -Wno-c23-extensions -o nm_shermes.o" >> "$SDK_DIR/README.txt"
        echo "" >> "$SDK_DIR/README.txt"
        echo "3. Link the object code into your final standalone .wasm executable module matching your exact arguments:" >> "$SDK_DIR/README.txt"
        echo "   \$WasiSdk/bin/clang++ -O3 nm_shermes.o ./obj/cxa.cpp.obj -o nm_shermes.wasm -L./lib -lshermes_console_a -lhermesvmlean_a -ljsi -lwasi-emulated-mman -lsetjmp" >> "$SDK_DIR/README.txt"

        tar -czf "$SDK_DIR.tar.gz" "$SDK_DIR/"

    - name: Upload SDK Archive Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: hermes-wasm-sdk-${{ matrix.os-name }}
        path: |
          hermes-wasm-sdk-${{ matrix.os-name }}.zip
          hermes-wasm-sdk-${{ matrix.os-name }}.tar.gz
